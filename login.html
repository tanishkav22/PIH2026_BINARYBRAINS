<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Savvy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crop Savvy Smart Farming Assistant">
    <meta name="theme-color" content="#1b5e20">

    <style>
* {
  margin: 5;
  padding: 5;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  scroll-behavior: smooth;
}

/* ===== Background Slideshow ===== */
body {
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  animation: backgroundSlide 20s infinite;
  color: white;
  overflow-x: hidden;
}

/* Background Animation */
@keyframes backgroundSlide {
  100% { background-image: url("https://images.unsplash.com/photo-1464226184884-fa280b87c399"); }
  0% { background-image: url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6"); }
  0% { background-image: url("https://images.unsplash.com/photo-1472396961693-142e6e269027"); }
  0% { background-image: url("https://images.unsplash.com/photo-1500382017468-9049fed747ef"); }
}

/* Dark Overlay */
.overlay {
  background: rgba(0,0,0,0);
  min-height: 75vh;
}


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1b5e20, #4caf50);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 360px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            width: 90px;
            height: auto;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 5px;
        }

        .subtitle {
            color: gray;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 14px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1b5e20;
        }

        .links {
            margin-top: 20px;
            font-size: 13px;
        }

        .links a {
            color: #2e7d32;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">
            <img src="C:\Users\lap\Desktop\prisha\cropsavvy.jpeg" alt="Crop Savvy Logo">
        </div>
        <h1><b>CropSavvy</b></h1>
        <p class="subtitle">Smart Farming Assistant</p>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="links">
            <p><a href="#">Forgot Password?</a></p>
            <p>New user? <a href="#">Register here</a></p>
        </div>
    </div>

    <!-- IBM Watson Assistant -->
    <script>
        window.watsonAssistantChatOptions = {
            integrationID: "86bebbdf-c336-44c3-bef5-bf72273c24a6",
            region: "eu-gb",
            serviceInstanceID: "ba0fa00e-a9f1-49c7-a8dc-c16fb08a4060",
            onLoad: function (instance) {
                instance.render();
            }
        };

        setTimeout(function () {
            const script = document.createElement("script");
            script.src = "https://web-chat.global.assistant.watson.appdomain.cloud/loadWatsonAssistantChat.js";
            document.head.appendChild(script);
        }, 2000);
    </script>

</body>
</html>
